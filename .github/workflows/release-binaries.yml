name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, or planned tag when verifying only'
        required: true
      verify_only:
        description: 'Build all platforms from qualified main without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-gate.yml
    with:
      tag: ${{ !inputs.verify_only && (inputs.tag || github.event.release.tag_name) || '' }}

  release:
    needs: qualify
    name: Validate release tag
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Validate tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: bash .github/scripts/release-tag.sh
      - name: Bind release to reviewed source
        id: source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          if [[ "$VERIFY_ONLY" == true ]]; then
            printf 'sha=%s\n' "$RELEASE_EVENT_SHA" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/release-source.sh
          fi
      - name: Require the qualified commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          QUALIFIED_SHA: ${{ needs.qualify.outputs.sha }}
        run: test "$SOURCE_SHA" = "$QUALIFIED_SHA"

  build:
    name: Build ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable (pinned)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc
        shell: bash

      - name: Install OpenSSL (Windows only)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows-static
          printf '%s\n' 'OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static' 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
        shell: bash

      - name: Install cross (Linux aarch64 only)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        shell: bash
        run: |
          FEATURES="vendored-openssl"
          # Windows uses vcpkg OpenSSL instead of vendored
          if [ "${{ runner.os }}" = "Windows" ]; then
            FEATURES=""
          fi

          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # Use thin LTO for cross builds to avoid OOM during linking
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=4
            cross build --release --target ${{ matrix.target }} ${FEATURES:+--features $FEATURES} -j2
          else
            cargo build --release --target ${{ matrix.target }} ${FEATURES:+--features $FEATURES} -j2
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          ARCHIVE="symbi-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/symbi staging/
          cp LICENSE README.md staging/
          cd staging
          tar czf "../${ARCHIVE}" -- *
          cd ..
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          ARCHIVE="symbi-${VERSION}-${{ matrix.target }}.zip"
          mkdir -p staging
          cp target/${{ matrix.target }}/release/symbi.exe staging/
          cp LICENSE README.md staging/
          cd staging
          7z a "../${ARCHIVE}" ./*
          cd ..
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  checksums:
    name: Create checksums and upload
    needs: [release, build]
    if: github.event_name == 'release' || !inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@e1523de7571e31dbe865fd2e80c5c7c23ae71eb4 # v3.4.0
        with:
          cosign-release: 'v2.2.3'

      - name: Record release source
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$SOURCE_SHA" \
            '{tag: $tag, commit: $commit}' > artifacts/release-source.json

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Sign artifacts with cosign
        run: |
          cd artifacts
          for file in *.tar.gz *.zip; do
            [ -f "$file" ] || continue
            echo "Signing $file..."
            cosign sign-blob --yes "$file" --output-signature "${file}.sig" --output-certificate "${file}.pem"
          done
          # Also sign the checksums file
          cosign sign-blob --yes checksums.txt --output-signature checksums.txt.sig --output-certificate checksums.txt.pem
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: artifacts/*
          body: |
            ## Pre-Built Binaries

            > **Note:** Pre-built binaries are tested but considered less reliable than installing via `cargo install symbi` or Docker (`ghcr.io/thirdkeyai/symbi`). If you encounter issues, please try those methods first.

            ### Quick Install

            **macOS / Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/thirdkeyai/symbiont/main/scripts/install.sh | bash
            ```

            **Homebrew (macOS):**
            ```bash
            brew tap thirdkeyai/tap
            brew install symbi
            ```

            **Manual download:**
            Download the appropriate binary for your platform from the assets below. Verify checksums with `checksums.txt`.

            ### Verification
            Each archive and `checksums.txt` is signed with Sigstore. Follow the
            [release verification guide](https://docs.symbiont.dev/release-verification/)
            for current Cosign commands. Verify the expected release workflow,
            source commit and checksum before extraction; `release-source.json`
            is covered by the signed checksum manifest.
          append_body: true

  update-homebrew:
    name: Update Homebrew formula
    needs: [release, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > checksums.txt

      - name: Checkout homebrew-tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: thirdkeyai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false

      - name: Update Homebrew formula
        id: formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Extract SHA256 values from the release artifacts
          DARWIN_ARM64=$(grep "aarch64-apple-darwin" ../artifacts/checksums.txt | awk '{print $1}')
          LINUX_ARM64=$(grep "aarch64-unknown-linux-gnu" ../artifacts/checksums.txt | awk '{print $1}')
          LINUX_AMD64=$(grep "x86_64-unknown-linux-gnu" ../artifacts/checksums.txt | awk '{print $1}')

          # Update version and placeholder checksums (first-time publish)
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/symbi.rb
          sed -i "s/PLACEHOLDER_ARM64_SHA256/${DARWIN_ARM64}/" Formula/symbi.rb
          sed -i "s/PLACEHOLDER_LINUX_ARM64_SHA256/${LINUX_ARM64}/" Formula/symbi.rb
          sed -i "s/PLACEHOLDER_LINUX_AMD64_SHA256/${LINUX_AMD64}/" Formula/symbi.rb

          # Handle subsequent updates (non-placeholder)
          sed -i "/aarch64-apple-darwin/{ n; s/sha256 \".*\"/sha256 \"${DARWIN_ARM64}\"/; }" Formula/symbi.rb
          sed -i "/aarch64-unknown-linux-gnu/{ n; s/sha256 \".*\"/sha256 \"${LINUX_ARM64}\"/; }" Formula/symbi.rb
          sed -i "/x86_64-unknown-linux-gnu/{ n; s/sha256 \".*\"/sha256 \"${LINUX_AMD64}\"/; }" Formula/symbi.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/symbi.rb

          # Skip when the formula is already at this version (re-run idempotent)
          if git diff --cached --quiet; then
            echo "No changes to Formula/symbi.rb — tap is already at ${VERSION}"
            exit 0
          fi

          git commit -m "Update symbi to ${VERSION}"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Push Homebrew formula
        if: steps.formula.outputs.changed == 'true'
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          case "$(git remote get-url origin)" in
            https://github.com/thirdkeyai/homebrew-tap|https://github.com/thirdkeyai/homebrew-tap.git) ;;
            *) printf '%s\n' 'Unexpected tap remote' >&2; exit 1 ;;
          esac
          AUTH=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git -c credential.helper= push origin HEAD
