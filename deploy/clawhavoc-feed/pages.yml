name: Publish update feed
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Check public artifact allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed = {'index.html', 'CNAME', 'clawhavoc/pack.json', 'clawhavoc/publisher.pem'}
          for path in Path('site').rglob('*'):
              if path.is_symlink():
                  raise SystemExit(f'Symlinks cannot be published: {path}')
              if path.is_file():
                  if path.relative_to('site').as_posix() not in allowed:
                      raise SystemExit(f'Unexpected public artifact: {path}')
                  if b'PRIVATE KEY' in path.read_bytes():
                      raise SystemExit(f'Private key material refused: {path}')
          pack = Path('site/clawhavoc/pack.json')
          key = Path('site/clawhavoc/publisher.pem')
          if pack.exists() != key.exists():
              raise SystemExit('Publish a reviewed signed pack and public key together')
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
