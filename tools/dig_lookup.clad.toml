# ToolClad manifest: DNS lookup via dig
# Demonstrates: enum type for record types, exec-form command, egress policy

[tool]
name = "dig_lookup"
version = "1.0.0"
binary = "dig"
description = "DNS record lookup"
timeout_seconds = 15
risk_tier = "low"
network_egress = true

[tool.cedar]
resource = "Tool::DnsLookup"
action = "execute_tool"

[args.target]
position = 1
required = true
type = "scope_target"
# Refuse loopback, private and metadata targets; a hostname must resolve to
# public addresses only (resolution failure is a refusal).
block_internal = true
description = "Domain name to query"

[args.record_type]
position = 2
required = false
type = "enum"
allowed = ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA", "PTR", "SRV", "ANY"]
default = "A"
description = "DNS record type"

[command]
exec = ["dig", "+short", "{target}", "{record_type}"]

[output]
format = "text"
envelope = true
max_bytes = 1048576

[output.schema]
type = "object"

[output.schema.properties.raw_output]
type = "string"
description = "DNS query results"
