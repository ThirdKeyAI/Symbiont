[package]
name = "symbi-sandbox-supervisor"
version = "1.21.1"
edition = "2021"
authors = ["Jascha Wanger / ThirdKey.ai"]
description = "Independent container lifetime and recovery supervisor for Symbiont"
license = "Apache-2.0"
repository = "https://github.com/thirdkeyai/symbiont"

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "time"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tempfile = "3.0"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "symbi-sandbox-supervisor"
path = "src/main.rs"
